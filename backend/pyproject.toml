[project]
name = "engineering-intelligence-api"
version = "0.1.0"
description = "Backend for a high-signal engineering intelligence portal"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "apscheduler>=3.10.4",
  "sqlalchemy>=2.0.36",
  "asyncpg>=0.30.0",
  "accelerate>=1.2.1",
  "email-validator>=2.2.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-slugify>=8.0.4",
  "httpx>=0.28.0",
  "feedparser>=6.0.11",
  "huggingface-hub>=0.33.0",
  "pgvector>=0.3.6",
  "torch>=2.5.1",
  "transformers>=4.51.0",
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
